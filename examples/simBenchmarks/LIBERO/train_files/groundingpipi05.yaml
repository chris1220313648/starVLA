run_id: groundingpipi05_libero
run_root_dir: playground/Checkpoints
seed: 42
is_debug: false
wandb_project: groundingpi
wandb_entity: null
version_id: '0.21'
framework:
  name: GroundingPIPI05
  qwenvl:
    backbone: groundingpi
    base_vlm: playground/Pretrained_models/GroundingPI
    attn_implementation: sdpa
    enable_gradient_checkpointing: true
    action_vocab_size: 2048
  action_model:
    action_dim: 7
    state_dim: 8
    action_horizon: 16
    expert_width: 1024
    expert_mlp_dim: 4096
    num_inference_steps: 10
datasets:
  vla_data:
    lerobot_version: v3.0
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LIBERO_LeRobot_v3_groundingpi
    data_mix: groundingpi_pi05_four
    include_state: true
    action_type: delta_qpos
    load_all_data_for_training: true
    per_device_batch_size: 1
    obs_image_size:
    - 224
    - 224
    video_backend: pyav
    image_size:
    - 224
    - 224
    state_action_dtype: float32
    num_workers: 2
    balance_dataset_weights: true
    normalize_state_on_server: true
trainer:
  max_train_steps: 100
  num_warmup_steps: 10
  save_interval: 1000
  eval_interval: 1000000000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  scheduler_specific_kwargs: {}
  gradient_clipping: 1.0
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 0.0
  weight_decay: 0.0
  logging_frequency: 10
  health_check_interval: 10
