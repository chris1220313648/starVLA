run_id: u0_pi05_libero_smoke
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: null
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.21"

framework:
  name: U0PI05
  u0:
    base_vlm: /root/nas/code/Xiaomi-Robotics-U0/training/models/Xiaomi-Robotics-U0-4B
    vision_tokenizer: playground/Pretrained_models/Emu3.5-VisionTokenizer
    action_token_start_id: 149595
    image_size: 224
    max_length: 2048
    max_new_tokens: 64
    attn_implementation: flash_attention_2
    gradient_checkpointing: true
    loss_chunk_tokens: 64
    use_cached_vision: true
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    action_horizon: 8
    state_dim: 8
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: false
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_goal
    include_state: true
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 1
    num_workers: 0
    pin_memory: false
    load_all_data_for_training: true
    video_backend: torchvision_av
    u0_vision_cache_dir: playground/Datasets/U0_VISION_CACHE

trainer:
  max_train_steps: 5
  num_warmup_steps: 1
  save_interval: 5
  eval_interval: 100000000
  save_format: safetensors
  learning_rate:
    base: 1.0e-5
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.1
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.1
