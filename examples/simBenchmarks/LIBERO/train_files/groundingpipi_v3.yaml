run_id: groundingpipi_v3_libero_goal
run_root_dir: playground/Checkpoints
seed: 42
is_debug: false
wandb_project: groundingpi
wandb_entity: null
version_id: '0.21'
framework:
  name: GroundingPIPIV3
  qwenvl:
    backbone: groundingpi
    base_vlm: playground/Pretrained_models/GroundingPI
    attn_implementation: sdpa
    enable_gradient_checkpointing: true
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    state_dim: 0
    action_horizon: 16
    num_inference_timesteps: 4
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      interleave_self_attention: false
datasets:
  vla_data:
    lerobot_version: v3.0
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LIBERO_LeRobot_v3_groundingpi
    data_mix: groundingpi_v3_libero_goal
    include_state: true
    normalize_state_on_server: true
    action_type: delta_qpos
    load_all_data_for_training: true
    per_device_batch_size: 16
    obs_image_size: [224, 224]
    image_size: [224, 224]
    video_backend: pyav
    state_action_dtype: float32
    num_workers: 2
    balance_dataset_weights: true
trainer:
  max_train_steps: 10000
  num_warmup_steps: 500
  repeated_diffusion_steps: 2
  health_check_interval: 100
  save_interval: 1000
  eval_interval: 1000000000
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
    project_layers: 1.0e-4
  freeze_modules: ''
  loss_scale: {vla: 1.0, vlm: 0.0}
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  scheduler_specific_kwargs: {}
  gradient_clipping: 1.0
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.0
  weight_decay: 0.0
  logging_frequency: 10
