run_id: emu_fast_libero_goal_text_tail
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: null
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.21"

framework:
  name: EmuFast
  emu:
    base_vlm: playground/Pretrained_models/Emu3.5
    vision_tokenizer: playground/Pretrained_models/Emu3.5-VisionTokenizer
    action_token_start_id: 149595  # FAST 0..2047 -> existing text IDs 149595..151642
    image_size: 224
    max_length: 2048
    max_new_tokens: 64
    attn_implementation: flash_attention_2
    gradient_checkpointing: true
    device_map: null
    vq_device: cpu
    lora:
      enabled: true
      r: 64
      alpha: 128
      dropout: 0.1
      target_modules: [q_proj, k_proj, v_proj, o_proj, lm_head]
  action_model:
    action_model_type: FAST
    action_dim: 7
    action_horizon: 8
    fast_tokenizer_name: playground/Pretrained_models/fast

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_goal
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 3
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 10000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 5000
  save_format: safetensors
  learning_rate:
    base: 1.0e-5
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.1
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.1
